# /etc/nginx/sites-available/g8row.xyz  (symlink into sites-enabled)
# plain http block; run `sudo certbot --nginx -d g8row.xyz -d www.g8row.xyz` once and
# certbot adds the 443 listener, certificates and the http -> https redirect.

server {
    listen 80;
    server_name g8row.xyz www.g8row.xyz;

    root /var/www/g8row.xyz;
    index index.html;

    if ($host = www.g8row.xyz) {
        return 301 https://g8row.xyz$request_uri;
    }

    # ── Compression, scoped to this vhost ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml;

    # nginx drops server-level add_header in any location that sets its own,
    # so each location carries the headers it needs.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # fonts never change name without changing content
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # css/js keep stable names, so a short cache plus revalidation
    location /assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
